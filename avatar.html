<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunucu Avatarı</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body.yesil { background: #00ff00; }
  body.koyu { background: #12131c; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  #basla { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    font: 600 18px "Segoe UI", system-ui, sans-serif; color: #fff; background: rgba(10,12,20,0.85); cursor: pointer; text-align: center; padding: 20px; }
  #basla small { font-weight: 400; opacity: 0.8; }
  #ayar { position: fixed; left: 8px; bottom: 8px; font: 12px system-ui, sans-serif; color: #fff; background: rgba(0,0,0,0.6); padding: 6px 8px; border-radius: 8px; display: none; }
  #ayar select, #ayar input { font: 12px system-ui; }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<div id="basla">🎙️ Mikrofonu başlatmak için tıklayın<small id="neden"></small></div>
<div id="ayar">
  Mikrofon: <select id="mic"></select>
  Hassasiyet: <input id="hass" type="range" min="1" max="10" value="5">
  <span id="seviye"></span>
</div>
<script>
'use strict';
/* =====================================================================
   SUNUCU AVATARI – mikrofondaki sese göre konuşan karakter (kamera gerekmez)
   Adres seçenekleri:
     ?arka=yesil  → yeşil perde (LIVE Studio'da renk anahtarı ile silinir)
     ?arka=koyu   → koyu arka plan          (varsayılan: şeffaf)
     ?ayar=1      → mikrofon seçimi ve hassasiyet ayarı görünür
     ?ten=1..5  ?sac=1..5  ?renk=1..6 (1 beyaz kapüşonlu)  ?kulaklik=1  → görünüş
   ===================================================================== */
const Q = new URLSearchParams(location.search);
if (Q.get('arka') === 'yesil') document.body.classList.add('yesil');
if (Q.get('arka') === 'koyu') document.body.classList.add('koyu');
const AYAR = Q.get('ayar') === '1';
const SKINS = ['#f1c9a5', '#d9a47e', '#c68c63', '#9a6440', '#6e4630'];
const HAIRS = ['#2b1d14', '#5a3a22', '#1a1512', '#c9a46a', '#8a4b2a'];
const SHIRTS = ['#f4f2ee', '#e53935', '#1e88e5', '#43a047', '#8e24aa', '#212121'];
const pickQ = (k, a, d) => a[Math.min(a.length, Math.max(1, Number(Q.get(k)) || d)) - 1];
const LOOK = { skin: pickQ('ten', SKINS, 2), hair: pickQ('sac', HAIRS, 3), shirt: pickQ('renk', SHIRTS, 1) };

const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 800, H = 800;
function fit() { const d = Math.min(2, window.devicePixelRatio || 1), s = Math.min(innerWidth, innerHeight) * d; cv.width = cv.height = Math.max(400, Math.round(s)); }
addEventListener('resize', fit); fit();

/* ---------- mikrofon ---------- */
let ac = null, an = null, buf = null, stream = null, level = 0, floor = 0.01, talk = 0;
async function startMic(deviceId) {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: deviceId ? { exact: deviceId } : undefined, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') await ac.resume();
    const src = ac.createMediaStreamSource(stream);
    an = ac.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.3; buf = new Float32Array(an.fftSize);
    src.connect(an);
    document.getElementById('basla').style.display = 'none';
    if (AYAR) listMics();
  } catch (e) {
    const b = document.getElementById('basla'); b.style.display = 'flex';
    document.getElementById('neden').textContent = 'Mikrofon izni verilmedi ya da mikrofon bulunamadı (' + (e.name || e) + ')';
  }
}
async function listMics() {
  const sel = document.getElementById('mic'); document.getElementById('ayar').style.display = 'block';
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
  sel.innerHTML = devs.map(d => '<option value="' + d.deviceId + '">' + (d.label || 'Mikrofon') + '</option>').join('');
  const cur = stream && stream.getAudioTracks()[0] && stream.getAudioTracks()[0].getSettings().deviceId; if (cur) sel.value = cur;
  sel.onchange = () => startMic(sel.value);
}
document.getElementById('basla').onclick = () => startMic();
startMic();
function readLevel(dt) {
  if (!an) return 0;
  an.getFloatTimeDomainData(buf);
  let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  const rms = Math.sqrt(s / buf.length);
  // gürültü tabanı: sessizken yavaşça ona uyar
  floor = rms < floor ? lerp(floor, rms, 0.2) : lerp(floor, rms, 0.002);
  const hass = Number(document.getElementById('hass').value) || 5;
  const v = clamp((rms - floor * 1.6) * (6 + hass * 4), 0, 1);
  return v;
}

/* ---------- animasyon ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v), lerp = (a, b, t) => a + (b - a) * t;
let loudT = 0, exciteT = 0, waveT = 0, waveCd = 6;
let t = 0, last = performance.now(), blinkT = 2, blink = 0, lookX = 0, lookTarget = 0, lookT = 3, bounce = 0, mouthPrev = 0, quiet = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  const raw = readLevel(dt);
  level = raw > level ? lerp(level, raw, 0.6) : lerp(level, raw, 0.25);
  talk = level > 0.08 ? Math.min(1, talk + dt * 4) : Math.max(0, talk - dt * 1.5);
  quiet = level > 0.08 ? 0 : quiet + dt;
  // göz kırpma
  blinkT -= dt; if (blinkT <= 0) { blink = 0.16; blinkT = 2 + Math.random() * 3.5; }
  blink = Math.max(0, blink - dt);
  // susunca etrafa bak
  lookT -= dt; if (lookT <= 0) { lookTarget = quiet > 1.5 ? (Math.random() * 2 - 1) : 0; lookT = 1.5 + Math.random() * 2.5; }
  lookX = lerp(lookX, lookTarget, dt * 4);
  bounce = lerp(bounce, level, 0.3);
  // yüksek ses → kollar havaya; uzun sessizlik → ara sıra el sallama
  if (level > 0.6) loudT += dt; else loudT = Math.max(0, loudT - dt * 2);
  if (loudT > 0.25) exciteT = 1.4;
  exciteT = Math.max(0, exciteT - dt);
  waveCd -= dt; if (quiet > 5 && waveCd <= 0) { waveT = 2.2; waveCd = 9 + Math.random() * 8; }
  waveT = Math.max(0, waveT - dt);
  updateArms(dt);
  draw();
  if (AYAR) document.getElementById('seviye').textContent = '🎚️ ' + Math.round(level * 100);
  requestAnimationFrame(frame);
}
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const f = c => Math.round(clamp(c * k, 0, 255)); return 'rgb(' + f(n >> 16 & 255) + ',' + f(n >> 8 & 255) + ',' + f(n & 255) + ')'; }
// kıvırcık saç bukleleri (sabit, her açılışta aynı)
const CURLS = (() => { const a = []; let seed = 7; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) { const ang = Math.PI * (1.08 + r() * 0.84), rad = 140 + r() * 45; a.push({ x: Math.cos(ang) * rad, y: -55 + Math.sin(ang) * rad * 0.95, r: 22 + r() * 20 }); }
  for (let i = 0; i < 24; i++) a.push({ x: -120 + r() * 240, y: -175 + r() * 60, r: 28 + r() * 20 });
  for (let i = 0; i < 6; i++) a.push({ x: (r() < 0.5 ? -1 : 1) * (140 + r() * 12), y: -70 + r() * 40, r: 14 + r() * 8 });
  return a; })();
const STUBBLE = (() => { const a = []; let seed = 3; const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 900; i++) { const x = -150 + r() * 300, y = 20 + r() * 170; const e = (x * x) / (150 * 150) + ((y - 0) * (y - 0)) / (185 * 185); if (e < 1 && !(Math.abs(x) < 70 && y < 70)) a.push([x, y]); }
  return a; })();
const KULAKLIK = Q.get('kulaklik') === '1';
// kollar: up = üst kolun dışa açısı (aşağıdan), fore = ön kolun açısı (+ dışa, − içe/yukarı)
const ARMS = [{ sx: -1, up: 0.12, fore: 0.05, ph: 0 }, { sx: 1, up: 0.12, fore: 0.05, ph: 1.7 }];
function updateArms(dt) {
  for (const A of ARMS) {
    let up, fore, hand = 0;
    if (exciteT > 0) { up = 2.5 + Math.sin(t * 9 + A.ph) * 0.12; fore = 2.85 + Math.sin(t * 11 + A.ph) * 0.15; hand = 1; }
    else if (waveT > 0 && A.sx === 1) { up = 1.35; fore = 2.75 + Math.sin(t * 11) * 0.4; hand = 1; }
    else if (talk > 0.15) {
      const k = Math.sin(t * 3.2 + A.ph), j = Math.sin(t * 5.3 + A.ph * 2);
      up = 0.32 + 0.12 * k + level * 0.25; fore = -2.25 + 0.38 * j - level * 0.3; hand = 0.5 + 0.5 * k;
    } else { up = 0.12 + Math.sin(t * 1.3 + A.ph) * 0.02; fore = 0.05; hand = 0; }
    const sp = Math.min(1, dt * (exciteT > 0 ? 10 : 6));
    A.up = lerp(A.up, up, sp); A.fore = lerp(A.fore, fore, sp); A.hand = lerp(A.hand || 0, hand, sp);
  }
}
function drawArms(breathe) {
  const U = 125, F = 112, sleeve = LOOK.shirt, sleeveD = shade(LOOK.shirt, 0.82);
  for (const A of ARMS) {
    const sx = A.sx, S = { x: 400 + sx * 198, y: 610 + breathe * 0.5 };
    const E = { x: S.x + sx * Math.sin(A.up) * U, y: S.y + Math.cos(A.up) * U };
    const Hn = { x: E.x + sx * Math.sin(A.fore) * F, y: E.y + Math.cos(A.fore) * F };
    g.lineCap = 'round'; g.lineJoin = 'round';
    g.strokeStyle = sleeveD; g.lineWidth = 62; g.beginPath(); g.moveTo(S.x, S.y); g.lineTo(E.x, E.y); g.lineTo(Hn.x, Hn.y); g.stroke();
    g.strokeStyle = sleeve; g.lineWidth = 52; g.beginPath(); g.moveTo(S.x, S.y); g.lineTo(E.x, E.y); g.lineTo(Hn.x, Hn.y); g.stroke();
    // manşet
    const dx = Hn.x - E.x, dy = Hn.y - E.y, dl = Math.hypot(dx, dy) || 1, ux = dx / dl, uy = dy / dl;
    g.strokeStyle = sleeveD; g.lineWidth = 50; g.beginPath(); g.moveTo(Hn.x - ux * 14, Hn.y - uy * 14); g.lineTo(Hn.x - ux * 2, Hn.y - uy * 2); g.stroke();
    // el: avuç + parmaklar (açık el ↔ yumruk)
    const hx = Hn.x + ux * 26, hy = Hn.y + uy * 26, ang = Math.atan2(uy, ux);
    g.save(); g.translate(hx, hy); g.rotate(ang - Math.PI / 2);
    g.fillStyle = LOOK.skin; g.strokeStyle = shade(LOOK.skin, 0.75); g.lineWidth = 3;
    g.beginPath(); g.ellipse(0, 0, 26, 30, 0, 0, Math.PI * 2); g.fill(); g.stroke();
    const open = A.hand;
    for (let i = 0; i < 4; i++) { const fx = -15 + i * 10, len = 12 + open * 22 - Math.abs(i - 1.5) * 3; g.beginPath(); g.moveTo(fx, 18); g.lineTo(fx + (i - 1.5) * open * 3, 18 + len); g.lineWidth = 11; g.strokeStyle = LOOK.skin; g.stroke(); }
    g.lineWidth = 11; g.beginPath(); g.moveTo(-sx * 20, 0); g.lineTo(-sx * (26 + open * 14), 10 + open * 6); g.stroke();   // başparmak
    // bileklik (sağ kol)
    if (sx === 1) { g.strokeStyle = '#c9ced6'; g.lineWidth = 5; g.beginPath(); g.ellipse(0, -26, 22, 7, 0, 0, Math.PI * 2); g.stroke(); }
    g.restore();
  }
}
function draw() {
  const s = cv.width / W;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
  g.setTransform(s, 0, 0, s, 0, 0);
  const breathe = Math.sin(t * 2) * 4, bob = -bounce * 16 + breathe, tilt = Math.sin(t * 6) * 0.05 * talk + lookX * 0.06;
  const open = clamp(level * 1.3, 0, 1);
  if (level > 0.08) { g.save(); g.globalAlpha = Math.min(0.6, level); g.strokeStyle = '#ffd23d'; g.lineWidth = 10; g.beginPath(); g.arc(400, 430, 330 + level * 30, 0, Math.PI * 2); g.stroke(); g.restore(); }
  // ---- beyaz kapüşonlu ----
  const hood = LOOK.shirt, hoodD = shade(hood, 0.86), hoodDD = shade(hood, 0.74);
  g.save(); g.translate(400, 800 + breathe * 0.5);
  g.fillStyle = hood; g.beginPath(); g.moveTo(-290, 0); g.quadraticCurveTo(-280, -200, -120, -232); g.lineTo(120, -232); g.quadraticCurveTo(280, -200, 290, 0); g.closePath(); g.fill();
  g.fillStyle = hoodD; g.beginPath(); g.moveTo(-290, 0); g.quadraticCurveTo(-284, -150, -200, -205); g.quadraticCurveTo(-240, -110, -230, 0); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(290, 0); g.quadraticCurveTo(284, -150, 200, -205); g.quadraticCurveTo(240, -110, 230, 0); g.closePath(); g.fill();
  // kapüşon yakası
  g.fillStyle = hoodD; g.beginPath(); g.ellipse(0, -232, 150, 46, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = hood; g.beginPath(); g.ellipse(0, -238, 118, 30, 0, 0, Math.PI * 2); g.fill();
  // bağcıklar
  g.strokeStyle = '#e9e6e0'; g.lineWidth = 7; g.lineCap = 'round';
  for (const sx of [-1, 1]) { const sw = Math.sin(t * 2 + sx) * 4; g.beginPath(); g.moveTo(sx * 34, -214); g.quadraticCurveTo(sx * 40 + sw, -150, sx * 36 + sw, -96); g.stroke(); g.fillStyle = '#9aa0a8'; g.fillRect(sx * 36 + sw - 4, -100, 8, 24); }
  g.strokeStyle = hoodDD; g.lineWidth = 3; g.beginPath(); g.moveTo(-160, -60); g.quadraticCurveTo(0, -40, 160, -60); g.stroke();
  g.restore();
  // boyun
  g.fillStyle = shade(LOOK.skin, 0.82); rr(352, 515 + bob * 0.3, 96, 80, 30); g.fill();
  drawArms(breathe);
  // ---- kafa ----
  g.save(); g.translate(400 + lookX * 6, 372 + bob); g.rotate(tilt);
  const hair = LOOK.hair, hairL = shade(hair, 1.6);
  // arka saç kütlesi
  g.fillStyle = hair; g.beginPath(); g.ellipse(0, -60, 190, 165, 0, Math.PI, 0); g.fill();
  // kulaklar
  g.fillStyle = LOOK.skin; g.beginPath(); g.ellipse(-152, 14, 24, 40, 0.1, 0, Math.PI * 2); g.ellipse(152, 14, 24, 40, -0.1, 0, Math.PI * 2); g.fill();
  g.fillStyle = shade(LOOK.skin, 0.8); g.beginPath(); g.ellipse(-154, 14, 11, 22, 0, 0, Math.PI * 2); g.ellipse(154, 14, 11, 22, 0, 0, Math.PI * 2); g.fill();
  // yüz (biraz uzun oval)
  g.fillStyle = LOOK.skin; g.beginPath(); g.ellipse(0, 6, 150, 186, 0, 0, Math.PI * 2); g.fill();
  // hafif sakal (çene ve yanaklar)
  g.save(); g.beginPath(); g.ellipse(0, 6, 150, 186, 0, 0, Math.PI * 2); g.clip();
  g.fillStyle = 'rgba(40,28,22,0.16)'; g.beginPath(); g.ellipse(0, 125, 150, 92, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = 'rgba(30,20,15,0.16)'; for (const [x, y] of STUBBLE) g.fillRect(x, y, 1.8, 1.8);
  g.restore();
  // kıvırcık saç (önde, alnı kısmen örter)
  for (const c of CURLS) { g.fillStyle = hair; g.beginPath(); g.arc(c.x, c.y, c.r, 0, Math.PI * 2); g.fill(); }
  g.strokeStyle = hairL; g.lineWidth = 3;
  for (const c of CURLS) { g.beginPath(); g.arc(c.x - c.r * 0.15, c.y - c.r * 0.1, c.r * 0.55, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
  // alın çizgisi: buklelerin altı
  g.fillStyle = hair; g.beginPath(); g.moveTo(-140, -70); g.quadraticCurveTo(-90, -118, -20, -112); g.quadraticCurveTo(50, -125, 110, -105); g.quadraticCurveTo(140, -95, 145, -70); g.lineTo(150, -120); g.lineTo(-150, -120); g.closePath(); g.fill();
  // kalın, düz kaşlar
  const brow = -8 * talk - level * 10;
  g.fillStyle = shade(hair, 1.1);
  for (const sx of [-1, 1]) { g.beginPath(); g.moveTo(sx * 28, -58 + brow); g.quadraticCurveTo(sx * 70, -74 + brow, sx * 112, -62 + brow); g.lineTo(sx * 110, -50 + brow); g.quadraticCurveTo(sx * 70, -60 + brow, sx * 30, -46 + brow); g.closePath(); g.fill(); }
  // gözler: yarı kapalı, rahat bakış (konuşurken biraz açılır)
  const lid = blink > 0 ? 1 : 0.42 - talk * 0.12 - level * 0.1;
  for (const sx of [-1, 1]) {
    const ex = sx * 66, ey = -14;
    g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(ex, ey, 30, 17, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#2a1a12'; g.beginPath(); g.arc(ex + lookX * 10, ey + 2, 12, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(ex + lookX * 10 + 4, ey - 3, 3.5, 0, Math.PI * 2); g.fill();
    // üst göz kapağı: gözün üst kısmını örter (yarı kapalı bakış)
    const lidY = ey - 17 + 34 * lid;
    g.save(); g.beginPath(); g.ellipse(ex, ey, 31, 18, 0, 0, Math.PI * 2); g.clip();
    g.fillStyle = shade(LOOK.skin, 0.92); g.fillRect(ex - 32, ey - 20, 64, lidY - (ey - 20)); g.restore();
    g.strokeStyle = '#3a2418'; g.lineWidth = 4; g.beginPath(); g.moveTo(ex - 31, ey + 1); g.quadraticCurveTo(ex, lidY - 6, ex + 31, ey + 1); g.stroke();
    g.strokeStyle = 'rgba(60,35,25,0.35)'; g.lineWidth = 3; g.beginPath(); g.arc(ex, ey + 16, 22, 0.2 * Math.PI, 0.8 * Math.PI); g.stroke();
  }
  // burun
  g.strokeStyle = shade(LOOK.skin, 0.72); g.lineWidth = 6; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-6, -2); g.quadraticCurveTo(-16, 44, -2, 54); g.stroke();
  g.fillStyle = shade(LOOK.skin, 0.8); g.beginPath(); g.ellipse(-14, 56, 9, 6, 0, 0, Math.PI * 2); g.ellipse(14, 56, 9, 6, 0, 0, Math.PI * 2); g.fill();
  // ağız
  const my = 110, mw = 40 + open * 18 + Math.sin(t * 22) * 3 * open, mh = 5 + open * 46;
  if (open < 0.06) { g.strokeStyle = '#8a4a3a'; g.lineWidth = 7; g.beginPath(); g.moveTo(-32, my - 2); g.quadraticCurveTo(0, my + 12, 34, my - 4); g.stroke(); }
  else {
    g.fillStyle = '#4a1414'; g.beginPath(); g.ellipse(0, my + mh * 0.35, mw, mh, 0, 0, Math.PI * 2); g.fill();
    g.save(); g.clip(); g.fillStyle = '#fff'; g.fillRect(-mw, my + mh * 0.35 - mh, mw * 2, Math.min(14, mh * 0.3));
    g.fillStyle = '#d86060'; g.beginPath(); g.ellipse(0, my + mh * 1.05, mw * 0.6, mh * 0.45, 0, 0, Math.PI * 2); g.fill(); g.restore();
  }
  // gür bıyık (ağız açılınca biraz kalkar)
  const mu = -open * 8;
  g.fillStyle = shade(hair, 1.05); g.beginPath();
  g.moveTo(0, 74 + mu); g.quadraticCurveTo(-40, 64 + mu, -78, 92 + mu); g.quadraticCurveTo(-88, 106 + mu, -70, 104 + mu);
  g.quadraticCurveTo(-40, 92 + mu, 0, 96 + mu); g.quadraticCurveTo(40, 92 + mu, 70, 104 + mu); g.quadraticCurveTo(88, 106 + mu, 78, 92 + mu);
  g.quadraticCurveTo(40, 64 + mu, 0, 74 + mu); g.closePath(); g.fill();
  g.strokeStyle = hairL; g.lineWidth = 2; for (let i = -60; i <= 60; i += 12) { g.beginPath(); g.moveTo(i, 78 + mu + Math.abs(i) * 0.15); g.lineTo(i * 1.1, 92 + mu + Math.abs(i) * 0.12); g.stroke(); }
  // isteğe bağlı kulaklık (?kulaklik=1)
  if (KULAKLIK) {
    g.strokeStyle = '#222'; g.lineWidth = 22; g.beginPath(); g.arc(0, -10, 190, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
    g.fillStyle = '#2a2a2a'; for (const sx of [-1, 1]) { rr(sx * 168 - 30, -30, 60, 100, 26); g.fill(); }
    g.strokeStyle = '#333'; g.lineWidth = 9; g.beginPath(); g.moveTo(-160, 50); g.quadraticCurveTo(-130, 140, -60, 140); g.stroke();
    g.fillStyle = level > 0.08 ? '#ff4d4d' : '#444'; g.beginPath(); g.ellipse(-52, 138, 18, 14, 0, 0, Math.PI * 2); g.fill();
  }
  g.restore();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
