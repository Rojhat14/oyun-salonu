<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunucu Avatarı</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body.yesil { background: #00ff00; }
  body.koyu { background: #12131c; }
  canvas { display: block; width: 100vw; height: 100vh; object-fit: contain; }
  #basla { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px;
    font: 600 18px "Segoe UI", system-ui, sans-serif; color: #fff; background: rgba(10,12,20,0.85); cursor: pointer; text-align: center; padding: 20px; }
  #basla small { font-weight: 400; opacity: 0.8; }
  #ayar { position: fixed; left: 8px; bottom: 8px; font: 12px system-ui, sans-serif; color: #fff; background: rgba(0,0,0,0.6); padding: 6px 8px; border-radius: 8px; display: none; }
  #ayar select, #ayar input { font: 12px system-ui; }
</style>
</head>
<body>
<canvas id="c" width="800" height="800"></canvas>
<div id="basla">🎙️ Mikrofonu başlatmak için tıklayın<small id="neden"></small></div>
<div id="ayar">
  Mikrofon: <select id="mic"></select>
  Hassasiyet: <input id="hass" type="range" min="1" max="10" value="5">
  <span id="seviye"></span>
</div>
<script>
'use strict';
/* =====================================================================
   SUNUCU AVATARI – mikrofondaki sese göre konuşan karakter (kamera gerekmez)
   Adres seçenekleri:
     ?arka=yesil  → yeşil perde (LIVE Studio'da renk anahtarı ile silinir)
     ?arka=koyu   → koyu arka plan          (varsayılan: şeffaf)
     ?ayar=1      → mikrofon seçimi ve hassasiyet ayarı görünür
     ?ten=1..5  ?sac=1..5  ?renk=1..6  → karakterin görünüşü
   ===================================================================== */
const Q = new URLSearchParams(location.search);
if (Q.get('arka') === 'yesil') document.body.classList.add('yesil');
if (Q.get('arka') === 'koyu') document.body.classList.add('koyu');
const AYAR = Q.get('ayar') === '1';
const SKINS = ['#f1c9a5', '#e0ac85', '#c68c63', '#9a6440', '#6e4630'];
const HAIRS = ['#2b1d14', '#5a3a22', '#141414', '#c9a46a', '#8a4b2a'];
const SHIRTS = ['#e53935', '#1e88e5', '#43a047', '#8e24aa', '#fb8c00', '#212121'];
const pickQ = (k, a, d) => a[Math.min(a.length, Math.max(1, Number(Q.get(k)) || d)) - 1];
const LOOK = { skin: pickQ('ten', SKINS, 2), hair: pickQ('sac', HAIRS, 1), shirt: pickQ('renk', SHIRTS, 2) };

const cv = document.getElementById('c'), g = cv.getContext('2d');
const W = 800, H = 800;
function fit() { const d = Math.min(2, window.devicePixelRatio || 1), s = Math.min(innerWidth, innerHeight) * d; cv.width = cv.height = Math.max(400, Math.round(s)); }
addEventListener('resize', fit); fit();

/* ---------- mikrofon ---------- */
let ac = null, an = null, buf = null, stream = null, level = 0, floor = 0.01, talk = 0;
async function startMic(deviceId) {
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: deviceId ? { exact: deviceId } : undefined, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') await ac.resume();
    const src = ac.createMediaStreamSource(stream);
    an = ac.createAnalyser(); an.fftSize = 1024; an.smoothingTimeConstant = 0.3; buf = new Float32Array(an.fftSize);
    src.connect(an);
    document.getElementById('basla').style.display = 'none';
    if (AYAR) listMics();
  } catch (e) {
    const b = document.getElementById('basla'); b.style.display = 'flex';
    document.getElementById('neden').textContent = 'Mikrofon izni verilmedi ya da mikrofon bulunamadı (' + (e.name || e) + ')';
  }
}
async function listMics() {
  const sel = document.getElementById('mic'); document.getElementById('ayar').style.display = 'block';
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
  sel.innerHTML = devs.map(d => '<option value="' + d.deviceId + '">' + (d.label || 'Mikrofon') + '</option>').join('');
  const cur = stream && stream.getAudioTracks()[0] && stream.getAudioTracks()[0].getSettings().deviceId; if (cur) sel.value = cur;
  sel.onchange = () => startMic(sel.value);
}
document.getElementById('basla').onclick = () => startMic();
startMic();
function readLevel(dt) {
  if (!an) return 0;
  an.getFloatTimeDomainData(buf);
  let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
  const rms = Math.sqrt(s / buf.length);
  // gürültü tabanı: sessizken yavaşça ona uyar
  floor = rms < floor ? lerp(floor, rms, 0.2) : lerp(floor, rms, 0.002);
  const hass = Number(document.getElementById('hass').value) || 5;
  const v = clamp((rms - floor * 1.6) * (6 + hass * 4), 0, 1);
  return v;
}

/* ---------- animasyon ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v), lerp = (a, b, t) => a + (b - a) * t;
let t = 0, last = performance.now(), blinkT = 2, blink = 0, lookX = 0, lookTarget = 0, lookT = 3, bounce = 0, mouthPrev = 0, quiet = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  const raw = readLevel(dt);
  level = raw > level ? lerp(level, raw, 0.6) : lerp(level, raw, 0.25);
  talk = level > 0.08 ? Math.min(1, talk + dt * 4) : Math.max(0, talk - dt * 1.5);
  quiet = level > 0.08 ? 0 : quiet + dt;
  // göz kırpma
  blinkT -= dt; if (blinkT <= 0) { blink = 0.16; blinkT = 2 + Math.random() * 3.5; }
  blink = Math.max(0, blink - dt);
  // susunca etrafa bak
  lookT -= dt; if (lookT <= 0) { lookTarget = quiet > 1.5 ? (Math.random() * 2 - 1) : 0; lookT = 1.5 + Math.random() * 2.5; }
  lookX = lerp(lookX, lookTarget, dt * 4);
  bounce = lerp(bounce, level, 0.3);
  draw();
  if (AYAR) document.getElementById('seviye').textContent = '🎚️ ' + Math.round(level * 100);
  requestAnimationFrame(frame);
}
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const f = c => Math.round(clamp(c * k, 0, 255)); return 'rgb(' + f(n >> 16 & 255) + ',' + f(n >> 8 & 255) + ',' + f(n & 255) + ')'; }
function draw() {
  const s = cv.width / W;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
  g.setTransform(s, 0, 0, s, 0, 0);
  const breathe = Math.sin(t * 2) * 4, bob = -bounce * 18 + breathe, tilt = Math.sin(t * 6) * 0.05 * talk + lookX * 0.06;
  // konuşma halkası
  if (level > 0.08) { g.save(); g.globalAlpha = Math.min(0.6, level); g.strokeStyle = '#ffd23d'; g.lineWidth = 10; g.beginPath(); g.arc(400, 430, 330 + level * 30, 0, Math.PI * 2); g.stroke(); g.restore(); }
  // gövde
  g.save(); g.translate(400, 800 + breathe * 0.5);
  g.fillStyle = LOOK.shirt; g.beginPath(); g.moveTo(-250, 0); g.quadraticCurveTo(-240, -190, -110, -215); g.lineTo(110, -215); g.quadraticCurveTo(240, -190, 250, 0); g.closePath(); g.fill();
  g.fillStyle = shade(LOOK.shirt, 0.75); g.beginPath(); g.moveTo(-60, -215); g.lineTo(0, -150); g.lineTo(60, -215); g.closePath(); g.fill();
  g.fillStyle = LOOK.skin; g.beginPath(); g.moveTo(-50, -215); g.lineTo(0, -160); g.lineTo(50, -215); g.closePath(); g.fill();
  g.restore();
  // boyun
  g.fillStyle = shade(LOOK.skin, 0.85); rr(355, 520 + bob * 0.3, 90, 90, 30); g.fill();
  // kafa
  g.save(); g.translate(400 + lookX * 6, 380 + bob); g.rotate(tilt);
  // arka saç
  g.fillStyle = LOOK.hair; g.beginPath(); g.ellipse(0, -40, 175, 185, 0, Math.PI, 0); g.fill();
  // kulaklar
  g.fillStyle = LOOK.skin; g.beginPath(); g.ellipse(-158, 10, 26, 40, 0, 0, Math.PI * 2); g.ellipse(158, 10, 26, 40, 0, 0, Math.PI * 2); g.fill();
  // yüz
  g.fillStyle = LOOK.skin; g.beginPath(); g.ellipse(0, 0, 160, 180, 0, 0, Math.PI * 2); g.fill();
  // ön saç
  g.fillStyle = LOOK.hair; g.beginPath(); g.moveTo(-165, -40); g.quadraticCurveTo(-150, -190, 0, -185); g.quadraticCurveTo(150, -190, 165, -40);
  g.quadraticCurveTo(120, -120, 40, -110); g.quadraticCurveTo(-20, -150, -60, -105); g.quadraticCurveTo(-120, -110, -165, -40); g.fill();
  // kaşlar
  const brow = -10 * talk - level * 12;
  g.strokeStyle = shade(LOOK.hair, 1.2); g.lineWidth = 12; g.lineCap = 'round';
  for (const sx of [-1, 1]) { g.beginPath(); g.moveTo(sx * 40, -62 + brow); g.quadraticCurveTo(sx * 72, -78 + brow, sx * 104, -64 + brow); g.stroke(); }
  // gözler
  const eyeH = blink > 0 ? 3 : 26;
  for (const sx of [-1, 1]) {
    g.fillStyle = '#ffffff'; g.beginPath(); g.ellipse(sx * 70, -18, 30, eyeH, 0, 0, Math.PI * 2); g.fill();
    if (blink <= 0) { g.fillStyle = '#2b1d14'; g.beginPath(); g.arc(sx * 70 + lookX * 12, -15, 15, 0, Math.PI * 2); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(sx * 70 + lookX * 12 + 5, -21, 5, 0, Math.PI * 2); g.fill(); }
  }
  // yanaklar
  g.fillStyle = 'rgba(255,120,120,0.22)'; g.beginPath(); g.ellipse(-100, 50, 26, 16, 0, 0, Math.PI * 2); g.ellipse(100, 50, 26, 16, 0, 0, Math.PI * 2); g.fill();
  // burun
  g.strokeStyle = shade(LOOK.skin, 0.75); g.lineWidth = 6; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(-10, 35, 4, 40); g.stroke();
  // ağız: sesin şiddetine göre açılır; sessizken hafif gülümser
  const open = clamp(level * 1.3, 0, 1), mw = 46 + open * 22 + Math.sin(t * 22) * 4 * open, mh = 6 + open * 52;
  if (open < 0.06) {
    g.strokeStyle = '#7a3b2e'; g.lineWidth = 8; g.beginPath(); g.moveTo(-40, 92); g.quadraticCurveTo(0, 112, 40, 92); g.stroke();
  } else {
    g.fillStyle = '#5a1a1a'; g.beginPath(); g.ellipse(0, 98, mw, mh, 0, 0, Math.PI * 2); g.fill();
    g.save(); g.clip();
    g.fillStyle = '#ffffff'; g.fillRect(-mw, 98 - mh, mw * 2, Math.min(16, mh * 0.35));
    g.fillStyle = '#e06666'; g.beginPath(); g.ellipse(0, 98 + mh * 0.7, mw * 0.6, mh * 0.45, 0, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  // kulaklık
  g.strokeStyle = '#222'; g.lineWidth = 22; g.beginPath(); g.arc(0, -10, 182, Math.PI * 1.05, Math.PI * 1.95); g.stroke();
  g.fillStyle = '#2a2a2a'; for (const sx of [-1, 1]) { rr(sx * 175 - 30, -40, 60, 100, 26); g.fill(); }
  g.fillStyle = LOOK.shirt; for (const sx of [-1, 1]) { rr(sx * 175 - 18, -22, 36, 64, 16); g.fill(); }
  // mikrofon kolu
  g.strokeStyle = '#333'; g.lineWidth = 9; g.beginPath(); g.moveTo(-170, 40); g.quadraticCurveTo(-140, 130, -60, 130); g.stroke();
  g.fillStyle = level > 0.08 ? '#ff4d4d' : '#444'; g.beginPath(); g.ellipse(-52, 128, 18, 14, 0, 0, Math.PI * 2); g.fill();
  g.restore();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
