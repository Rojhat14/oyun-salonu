<script>
/* =====================================================================
   NET – oyunun dış dünyayla bağlantısı.
   • Tek başına açılırsa köprüye (ws://localhost:8080) bağlanır.
   • Oyun Salonu'nun içinde (iframe, ?salon=1) açılırsa olayları salondan alır,
     spiker isteklerini ve "oyun bitti" haberini salona gönderir.
   Kullanım: NET.on(m => …)  NET.send({type:'say',…})  NET.open()  NET.finish({…})
   ===================================================================== */
const NET = (function () {
  const embedded = window.parent !== window && /[?&]salon=1\b/.test(location.search);
  const handlers = [];
  let ws = null, status = embedded ? 'salon' : 'bağlı değil', readySent = false;
  const emit = m => { for (const h of handlers) { try { h(m); } catch (e) { console.error(e); } } };
  function screenInfo() { return { type: 'ekran', w: window.innerWidth, h: window.innerHeight, dpr: window.devicePixelRatio || 1, ua: navigator.userAgent.slice(0, 160) }; }
  function wsUrl() {
    if (location.protocol === 'http:' && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return 'ws://' + location.host + '/ws';
    return 'ws://localhost:8080';
  }
  function connect() {
    let s;
    try { s = new WebSocket(wsUrl()); } catch (e) { setTimeout(connect, 4000); return; }
    ws = s;
    s.onopen = () => { status = 'bağlı'; send(screenInfo()); };
    s.onmessage = m => { try { const d = JSON.parse(m.data); for (const x of Array.isArray(d) ? d : [d]) if (x) emit(x); } catch (e) { /* bozuk */ } };
    s.onerror = () => {};
    s.onclose = () => { status = 'bağlı değil'; if (ws === s) ws = null; setTimeout(connect, 4000); };
  }
  function send(o) {
    if (embedded) { try { window.parent.postMessage({ salonOyun: true, msg: o }, '*'); } catch (e) { /* sessiz */ } return; }
    if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify(o)); } catch (e) { /* sessiz */ } }
  }
  if (embedded) {
    window.addEventListener('message', ev => {
      if (ev.source !== window.parent) return;
      const d = ev.data; if (d && d.salon && d.msg) emit(d.msg);
    });
  } else if (!/[?&]baglanti=0\b/.test(location.search)) setTimeout(connect, 0);
  return {
    embedded,
    on(fn) { handlers.push(fn); },
    send,
    open() { return embedded || (!!ws && ws.readyState === 1); },
    get status() { return status; },
    // oyun hazır: salon bekleyen oyuncuları gönderir
    ready() { if (embedded && !readySent) { readySent = true; send({ type: 'hazir' }); } },
    // oyun bitti: salon oylamaya döner
    finish(summary) { if (embedded) send(Object.assign({ type: 'bitti' }, summary || {})); }
  };
})();

/* =====================================================================
   MUZIK – arka plan müziği; dosya yok, tarayıcıda anlık üretilir (telifsiz).
   MUZIK.start('salon' | 'yaris' | 'savas' | 'elektro' | 'gece')   MUZIK.stop()
   Ses düzeyi: adrese ?muzik=0..10 (varsayılan 3; 0 = kapalı)
   ===================================================================== */
const MUZIK = (function () {
  const m = location.search.match(/[?&]muzik=(\d+)/);
  const LEVEL = m ? Math.min(10, Number(m[1])) : 3;
  const STYLES = {
    salon:   { bpm: 96,  key: 60, prog: [[0, 'M'], [7, 'M'], [9, 'm'], [5, 'M']], kick: [0, 8], snare: [], hat: [4, 12], arp: 8, lead: 0.5 },
    yaris:   { bpm: 128, key: 57, prog: [[0, 'm'], [8, 'M'], [3, 'M'], [10, 'M']], kick: [0, 4, 8, 12], snare: [4, 12], hat: [2, 6, 10, 14], arp: 16, lead: 0.6 },
    savas:   { bpm: 108, key: 50, prog: [[0, 'm'], [8, 'M'], [10, 'M'], [0, 'm']], kick: [0, 3, 6, 8, 11, 14], snare: [12], hat: [], arp: 8, lead: 0.35, tom: true },
    elektro: { bpm: 124, key: 55, prog: [[0, 'm'], [0, 'm'], [8, 'M'], [10, 'M']], kick: [0, 4, 8, 12], snare: [4, 12], hat: [1, 3, 5, 7, 9, 11, 13, 15], arp: 16, lead: 0.7 },
    gece:    { bpm: 66,  key: 52, prog: [[0, 'm'], [5, 'm'], [0, 'm'], [11, 'M']], kick: [], snare: [], hat: [], arp: 0, lead: 0, drone: true }
  };
  let ac = null, out = null, st = null, timer = null, step = 0, nextT = 0, bar = 0, gen = 0;
  const f = n => 440 * Math.pow(2, (n - 69) / 12);
  function ctx() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      out = ac.createGain(); out.gain.value = 0;
      const comp = ac.createDynamicsCompressor(); out.connect(comp); comp.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume().catch(() => {});
    return ac;
  }
  function osc(type, freq, t, dur, vol, cutoff, attack) {
    const o = ac.createOscillator(), g = ac.createGain(), fl = ac.createBiquadFilter();
    o.type = type; o.frequency.value = freq; fl.type = 'lowpass'; fl.frequency.value = cutoff || 2000;
    const a = attack || 0.01;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(fl); fl.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
  let noiseBuf = null;
  function noise(t, dur, vol, hp) {
    if (!noiseBuf) { noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ac.createBufferSource(), g = ac.createGain(), fl = ac.createBiquadFilter();
    s.buffer = noiseBuf; fl.type = 'highpass'; fl.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(out); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  function kick(t, deep) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(deep ? 110 : 150, t); o.frequency.exponentialRampToValueAtTime(deep ? 38 : 45, t + 0.18);
    g.gain.setValueAtTime(deep ? 0.9 : 0.7, t); g.gain.exponentialRampToValueAtTime(0.0001, t + (deep ? 0.45 : 0.25));
    o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.5);
  }
  function chordNotes(root, q) { return q === 'M' ? [0, 4, 7].map(x => root + x) : [0, 3, 7].map(x => root + x); }
  function tick() {
    const spb = 60 / st.bpm / 4;   // 16'lık nota süresi
    while (nextT < ac.currentTime + 0.15) {
      const s = step % 16, [deg, q] = st.prog[bar % st.prog.length], root = st.key + deg, ch = chordNotes(root, q);
      if (s === 0) {
        // pad akoru (yumuşak)
        for (const n of ch) { osc('sawtooth', f(n), nextT, spb * 16 * 1.05, 0.035, st.drone ? 500 : 900, st.drone ? 1.5 : 0.25); osc('sawtooth', f(n) * 1.006, nextT, spb * 16, 0.025, 800, 0.3); }
        if (st.drone) osc('sine', f(root - 24), nextT, spb * 16 * 1.1, 0.12, 300, 1.2);
      }
      // bas
      if (!st.drone && (s % 4 === 0 || (st.bpm > 115 && s % 2 === 0))) osc('triangle', f(root - 24), nextT, spb * 1.8, 0.16, 600);
      // arpej
      if (st.arp && s % (16 / st.arp) === 0 && Math.random() < 0.9) { const n = ch[(step / (16 / st.arp)) % 3 | 0] + 12; osc('square', f(n), nextT, spb * 1.4, 0.022 * st.lead, 1800); }
      // gece: seyrek çan sesleri
      if (st.drone && s % 4 === 0 && Math.random() < 0.18) osc('sine', f(pick3(ch) + 24), nextT, 2.2, 0.05, 3000, 0.005);
      // davul
      if (st.kick.includes(s)) kick(nextT, !!st.tom);
      if (st.snare.includes(s)) noise(nextT, 0.16, 0.18, 1500);
      if (st.hat.includes(s)) noise(nextT, 0.04, 0.07, 7000);
      nextT += spb; step++; if (step % 16 === 0) bar++;
    }
  }
  const pick3 = a => a[(Math.random() * a.length) | 0];
  function start(style) {
    if (!LEVEL || !STYLES[style]) return;
    if (!ctx()) return;
    gen++; st = STYLES[style]; step = 0; bar = 0; nextT = ac.currentTime + 0.1;
    out.gain.cancelScheduledValues(ac.currentTime); out.gain.setValueAtTime(out.gain.value, ac.currentTime);
    out.gain.linearRampToValueAtTime(0.06 * LEVEL / 3, ac.currentTime + 2);   // yumuşak giriş
    if (!timer) timer = setInterval(() => { try { if (st) tick(); } catch (e) { /* sessiz */ } }, 30);
  }
  function stop() {
    if (!ac || !out) return;
    out.gain.cancelScheduledValues(ac.currentTime); out.gain.setValueAtTime(out.gain.value, ac.currentTime);
    out.gain.linearRampToValueAtTime(0, ac.currentTime + 1);
    const my = ++gen; setTimeout(() => { if (gen === my) st = null; }, 1200);
  }
  // tarayıcı sesi kilitlediyse ilk tıklamada aç
  window.addEventListener('pointerdown', () => { if (ac && ac.state === 'suspended') ac.resume(); }, { once: true });
  return { start, stop };
})();

</script>
<script>
/* =====================================================================
   ORTAK – salon ve 2D oyunların paylaştığı araçlar
   (çizim yardımcıları, ekran ölçekleme, spiker, ses efektleri, olay biçimi)
   Gerekli: net.js önce yüklenmiş olmalı. Sayfada <canvas id="game"> bulunmalı.
   ===================================================================== */
'use strict';
const W = 1080, H = 1920;
const SAFE_TOP = 222, SAFE_BOTTOM = 1300;      // TikTok uygulamasında üst ~215 px ve alttaki yorumlar kapanır
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let RS = 1;
function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  RS = Math.round(Math.min(2, Math.max(1, cw * (window.devicePixelRatio || 1) / W)) * 4) / 4;
  if (canvas.width !== Math.round(W * RS)) { canvas.width = Math.round(W * RS); canvas.height = Math.round(H * RS); }
}
window.addEventListener('resize', fit); fit();

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const TAU = Math.PI * 2;
const FONT = '"Segoe UI", "Trebuchet MS", Tahoma, sans-serif';
const TFONT = 'Georgia, "Palatino Linotype", "Times New Roman", serif';
const fmt = n => Math.round(n).toLocaleString('tr-TR');
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rrPath(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function setFont(size, o) { ctx.font = ((o && o.weight) || 'bold') + ' ' + size + 'px ' + ((o && o.font) || FONT); }
function txt(s, x, y, size, color, align, o) {
  o = o || {};
  setFont(size, o);
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  if (o.stroke !== false) { ctx.lineJoin = 'round'; ctx.lineWidth = o.lw || Math.max(3, size / 6); ctx.strokeStyle = o.sc || 'rgba(8,10,18,0.9)'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function fitText(s, maxW) {
  if (ctx.measureText(s).width <= maxW) return s;
  const a = Array.from(s);
  while (a.length > 1 && ctx.measureText(a.join('') + '…').width > maxW) a.pop();
  return a.join('') + '…';
}
function panel(x, y, w, h, r, fill, stroke, lw) {
  rrPath(ctx, x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.stroke(); }
}
function cleanName(n, max) {
  n = String(n == null ? '' : n).replace(/[\u0000-\u001f\u007f<>]/g, '').replace(/\s+/g, ' ').trim();
  if (!n) n = 'Anonim';
  const a = Array.from(n);
  return a.length > max ? a.slice(0, max).join('') + '…' : n;
}
const BANNED_WORDS = ['amk', 'aq', 'orospu', 'piç', 'pic', 'sik', 'yarrak', 'göt', 'got', 'ibne', 'pezevenk', 'kahpe', 'siktir', 'amın', 'amin', 'gavat', 'sürtük', 'mal', 'salak', 'aptal', 'fuck', 'shit', 'bitch', 'porn', 'sex', 'seks'];
function speakName(raw) {
  let s = String(raw || '').normalize('NFC').replace(/[_.\-]+/g, ' ').replace(/[^\p{L}\p{N} ]/gu, '').replace(/\s+/g, ' ').trim();
  s = Array.from(s).slice(0, 20).join('').trim();
  if (!s || !/\p{L}/u.test(s)) return 'bir izleyici';
  const low = s.toLocaleLowerCase('tr'), words = low.split(' ');
  for (const b of BANNED_WORDS) if (b.length <= 3 ? words.includes(b) : low.includes(b)) return 'bir izleyici';
  return s;
}
// köprüden gelen olayı tek biçime çevirir
function normEvent(ev) {
  if (!ev || typeof ev !== 'object') return null;
  const type = String(ev.type || '').toLowerCase();
  if (!['chat', 'like', 'gift', 'follow', 'share', 'member'].includes(type)) return null;
  const key = String(ev.user || ev.nickname || 'anonim').slice(0, 80);
  const raw = String(ev.nickname || ev.user || 'Anonim');
  return { type, key, raw, name: cleanName(raw, 16), text: String(ev.text || '').slice(0, 200),
    count: Math.max(1, Math.min(Math.floor(Number(ev.count) || 1), 100000)), diamonds: Math.max(0, Math.floor(Number(ev.diamonds) || 0)) };
}
const trLow = s => String(s || '').toLocaleLowerCase('tr').normalize('NFC');

/* ---------- Spiker: köprünün Türkçe sesi (Yelda), yoksa tarayıcı sesi ---------- */
// Spiker sesi açık; kapatmak için adrese ?spiker=0 (o zaman sadece altyazı)
const SPIKER_ACIK = !/[?&]spiker=0\b/.test(location.search);
const SPEECH = (function () {
  const queue = [], waiting = new Map(), lastCat = {};
  let busy = false, caption = '', captionAt = -1e9, reqId = Math.floor(Math.random() * 1e9);
  const now = () => performance.now() / 1000;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  function say(text, prio, cat, cooldown) {
    if (!text) return;
    if (cat && cooldown && lastCat[cat] != null && now() - lastCat[cat] < cooldown) return;
    if (cat) lastCat[cat] = now();
    if (!SPIKER_ACIK) { caption = text; captionAt = performance.now(); return; }   // sadece altyazı
    const item = { text, prio: prio || 1 };
    if (queue.length >= 3) {
      let lo = 0; for (let i = 1; i < queue.length; i++) if (queue[i].prio < queue[lo].prio) lo = i;
      if (queue[lo].prio >= item.prio) return;
      queue.splice(lo, 1);
    }
    let i = queue.findIndex(q => q.prio < item.prio); if (i < 0) i = queue.length;
    queue.splice(i, 0, item); pump();
  }
  function pump() {
    if (busy || !queue.length) return;
    const it = queue.shift(); busy = true; caption = it.text; captionAt = performance.now();
    play(it.text).then(() => { busy = false; setTimeout(pump, 250); });
  }
  async function play(text) {
    if (NET.open()) { const b64 = await request(text); if (b64 && await playWav(b64)) return; }
    if ('speechSynthesis' in window) { await browserSay(text); return; }
    await wait(Math.min(5000, 1200 + text.length * 55));
  }
  function request(text) {
    return new Promise(res => {
      const id = ++reqId, to = setTimeout(() => { waiting.delete(id); res(null); }, 6000);
      waiting.set(id, b64 => { clearTimeout(to); res(b64); });
      NET.send({ type: 'say', id, text });
    });
  }
  function onTTS(m) { const f = waiting.get(m.id); if (f) { waiting.delete(m.id); f(m.audio || null); } }
  function playWav(b64) {
    return new Promise(res => {
      try {
        const bin = atob(b64), u8 = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([u8], { type: 'audio/wav' }));
        const a = new Audio(url);
        let done = false; const fin = okk => { if (done) return; done = true; URL.revokeObjectURL(url); res(okk); };
        a.onended = () => fin(true); a.onerror = () => fin(false); setTimeout(() => fin(true), 15000);
        a.play().catch(() => fin(false));
      } catch (e) { res(false); }
    });
  }
  function browserSay(text) {
    return new Promise(res => {
      try {
        const u = new SpeechSynthesisUtterance(text); u.lang = 'tr-TR'; u.rate = 1.08;
        const v = speechSynthesis.getVoices().find(x => /^tr/i.test(x.lang)); if (v) u.voice = v;
        let done = false; const fin = () => { if (!done) { done = true; res(); } };
        u.onend = fin; u.onerror = fin; setTimeout(fin, 12000); speechSynthesis.speak(u);
      } catch (e) { res(); }
    });
  }
  return { say, onTTS, get speaking() { return busy; }, get caption() { return caption; }, get captionAge() { return (performance.now() - captionAt) / 1000; }, clear() { queue.length = 0; } };
})();

/* ---------- Ses efektleri (dosyasız, telifsiz) ---------- */
const SFX = (function () {
  let ac = null, master = null;
  function A() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = 0.5; master.connect(ac.destination); } catch (e) { return null; } }
    if (ac.state === 'suspended') ac.resume().catch(() => {});
    return ac;
  }
  function tone(f, d, type, vol, slide, delay) {
    const a = A(); if (!a) return;
    const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
  }
  function noise(d, vol, hp) {
    const a = A(); if (!a) return;
    const b = a.createBuffer(1, Math.floor(a.sampleRate * d), a.sampleRate), ch = b.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
    const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp || 600; s.buffer = b; g.gain.value = vol || 0.15;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }
  return {
    join() { tone(660, 0.12, 'triangle', 0.15); tone(990, 0.15, 'triangle', 0.12, 1, 0.08); },
    vote() { tone(880, 0.08, 'square', 0.06); },
    tick() { tone(1200, 0.05, 'square', 0.05); },
    go() { tone(523, 0.18, 'triangle', 0.2); tone(659, 0.18, 'triangle', 0.2, 1, 0.15); tone(784, 0.35, 'triangle', 0.22, 1, 0.3); },
    thanks() { tone(784, 0.15, 'sine', 0.18); tone(1046, 0.25, 'sine', 0.18, 1, 0.12); tone(1318, 0.3, 'sine', 0.15, 1, 0.24); },
    pull() { tone(140, 0.12, 'sawtooth', 0.05, 0.7); },
    cheer() { noise(1.2, 0.12, 900); },
    win() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.28, 'triangle', 0.2, 1, i * 0.16)); noise(1.6, 0.1, 1200); },
    boom() { tone(90, 0.5, 'sawtooth', 0.25, 0.4); noise(0.5, 0.2, 200); }
  };
})();
window.addEventListener('pointerdown', () => SFX.vote(), { once: true });

/* ---------- Konfeti ---------- */
const CONFETTI = [];
function confetti(n, x, y) {
  for (let i = 0; i < n; i++) CONFETTI.push({ x: x == null ? rand(0, W) : x, y: y == null ? rand(-200, 0) : y, vx: rand(-200, 200), vy: rand(-300, 200), g: 500, rot: rand(0, TAU), vr: rand(-8, 8), size: rand(12, 22), life: rand(2, 3.5), color: pick(['#ffd23d', '#ff5a7a', '#4fc3f7', '#7ee081', '#ffffff', '#ff9f1a']) });
  if (CONFETTI.length > 600) CONFETTI.splice(0, CONFETTI.length - 600);
}
function updConfetti(dt) {

  }
  for (const c of CITY) if (c.flash > 0) c.flash = Math.max(0, c.flash - dt * 1.2);
  if (G.toast && G.t - G.toast.born > G.toast.dur) G.toast = null;
  if (!G.toast && G.toasts.length) {
    const joins = G.toasts.filter(t => t.kind === 'join');
    if (G.toasts[0].kind === 'join' && joins.length >= 3) { G.toasts = G.toasts.filter(t => t.kind !== 'join'); G.toast = { kind: 'group', title: '+' + joins.length + ' YENİ ASKER', names: joins.map(j => j.name + ' (' + CITY[TEAM[j.team].city].ad + ')'), born: G.t, dur: 2.6 }; }
    else { const t = G.toasts.shift(); G.toast = Object.assign(t, { born: G.t, dur: t.kind === 'gift' ? 3.5 : 2.2 }); }
  }
  if (G.blast && G.t - G.blast.born > 2.4) G.blast = null;
  for (const [k, u] of G.unassigned) if (G.t - u.t > 60 || G.players.has(k)) G.unassigned.delete(k);
}
function ranking() { return TEAM.map((T, t) => ({ t, n: regionsOf(t), s: T.score })).sort((a, b) => b.n - a.n || b.s - a.s); }
function endRound() {
  if (G.phase !== 'match') return;
  const r = ranking(); G.phase = 'results'; G.phaseT = 0; G.winner = r.length ? r[0].t : -1;
  if (G.winner >= 0) TEAM[G.winner].wins = STORE.win(CITY[TEAM[G.winner].city].ad);
  SFX.win(); confetti(220);
  if (G.winner >= 0) { const T = TEAM[G.winner], mvp = topMembers(G.winner, 1)[0]; SPEECH.say(CITY[T.city].ad + ' kazandı! ' + regionsOf(G.winner) + ' il fethetti!' + (mvp ? ' Komutan ' + speakName(mvp.raw) + '!' : ''), 3); }
}
function topMembers(t, n) { return Array.from(TEAM[t].members, k => G.players.get(k)).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, n); }
function finish() {
  if (NET.embedded) { if (!G.finSent) { G.finSent = true; NET.finish({ kazanan: G.winner >= 0 ? CITY[TEAM[G.winner].city].ad : null }); } }
  else newRound();
}

/* ---------- çizim ---------- */
function drawScene() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d2a4a'); g.addColorStop(0.5, '#174a78'); g.addColorStop(1, '#0b2038');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // deniz dalgaları
  ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 2;
  for (let y = 560; y < 1120; y += 26) { ctx.beginPath(); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, y + Math.sin(x * 0.02 + G.t + y) * 4); ctx.stroke(); }
  if (mapDirty) paintMap();
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.imageSmoothingEnabled = false; ctx.drawImage(mapCanvas, MAP.x, MAP.y, GW * CELL, GH * CELL);
  ctx.restore();
  // fetih parlaması
  for (const c of CITY) if (c.flash > 0) { ctx.globalAlpha = c.flash; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(c.x, c.y, 14 + (1 - c.flash) * 40, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1; }
  // başkentler
  TEAM.forEach((T, t) => {
    const c = CITY[T.city], held = c.owner === t;
    ctx.fillStyle = held ? T.renk : '#555'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(c.x, c.y, 11, 0, TAU); ctx.fill(); ctx.stroke();
    txt('★', c.x, c.y + 1, 14, '#fff', 'center', { stroke: false });
  });
  // en büyük 6 şehrin adı
  const top = ranking().slice(0, 6);
  for (const r of top) { const c = CITY[TEAM[r.t].city]; setFont(20); txt(c.ad + ' ' + r.n, c.x, c.y - 24, 20, '#ffffff', 'center', { lw: 5, sc: 'rgba(0,0,0,0.85)' }); }
}
function drawHud() {
  panel(24, SAFE_TOP + 6, 1032, 96, 22, 'rgba(14,18,34,0.9)', '#ffd23d', 3);
  txt('🗺️ ŞEHİR SAVAŞLARI', 44, SAFE_TOP + 36, 30, '#ffd23d', 'left', { font: TFONT, lw: 5 });
  txt('TUR ' + G.round + ' · ' + TEAM.length + ' şehir · ' + G.players.size + ' asker', 44, SAFE_TOP + 76, 22, '#cfd3f2', 'left', { stroke: false });
  if (G.phase === 'match') { const left = Math.max(0, Math.ceil(G.matchEnd - G.t)); txt('⏱️ ' + left, 1036, SAFE_TOP + 54, 48, left <= 10 ? '#ff6b6b' : '#ffffff', 'right', { lw: 6 }); }
  drawCaption(SAFE_TOP + 112);
  // sıralama: en çok ili olan 6 şehir (iki sütun)
  const r = ranking().slice(0, 6), py = SAFE_TOP + 180;
  if (r.length) {
    panel(24, py, 1032, 30 + Math.ceil(r.length / 2) * 40 + 8, 16, 'rgba(14,18,34,0.8)', 'rgba(255,255,255,0.25)', 2);
    txt('🏆 EN ÇOK İL', 540, py + 18, 20, '#ffd23d', 'center', { stroke: false });
    r.forEach((x, i) => {
      const T = TEAM[x.t], col = i % 2, row = (i / 2) | 0, cx = 44 + col * 516, cy = py + 52 + row * 40;
      ctx.fillStyle = T.renk; ctx.beginPath(); ctx.arc(cx + 12, cy, 12, 0, TAU); ctx.fill();
      setFont(24); txt((i + 1) + '. ' + fitText(CITY[T.city].ad, 220), cx + 32, cy, 24, '#fff', 'left', { stroke: false });
      txt('🗺️ ' + x.n + '  👥 ' + T.members.size, cx + 490, cy, 22, '#ffd23d', 'right', { stroke: false });
    });
  }
  // ipucu
  const hints = [['💬 Yoruma şehrini yaz → ör. istanbul · 34 · antep', '#3949ab'], ['🗺️ Şehirler komşu illeri FETHEDER', '#d81b60'], ['🏆 Süre bitince en çok ili olan şehir kazanır', '#2e7d32']];
  const [ht, hc] = hints[Math.floor(G.t / 5) % hints.length];
  panel(24, 1236, 1032, 58, 29, 'rgba(14,18,34,0.9)', hc, 4);
  txt(ht, 540, 1266, 29, '#ffffff', 'center', { lw: 6 });
  const tk = G.ticker.filter(x => G.t - x.t < 5).slice(-2);
  tk.forEach((x, i) => { setFont(24); txt(fitText(x.s, 1000), 540, 1206 - (tk.length - 1 - i) * 32, 24, '#ffffff', 'center', { lw: 5 }); });
}
function drawLobby() {
  if (G.phase !== 'lobby') return;
  const y = 1062;
  panel(90, y - 2, 900, 96, 24, 'rgba(14,18,34,0.9)', '#ffd23d', 3);
  if (G.lobbyEnd) { const l = Math.max(0, Math.ceil(G.lobbyEnd - G.t)); txt('⚔️ Savaş ' + l + ' sn sonra başlıyor!', 540, y + 28, 36, '#ffd23d', 'center', { lw: 6 }); }
  else txt('🏙️ ŞEHRİNİ YAZ! En az 2 şehir bekleniyor', 540, y + 28, 32, '#ffd23d', 'center', { lw: 6 });
  const wait = Array.from(G.unassigned.values()).slice(-4).map(u => u.name);
  setFont(22); txt(wait.length ? fitText('Şehir bekleyenler: ' + wait.join(', '), 860) : 'Örnek: istanbul · ankara · 35 · antep · urfa', 540, y + 68, 22, '#cfd3f2', 'center', { stroke: false });
}
function drawCard() {
  const t = G.toast; if (!t || G.phase === 'results') return;
  const age = G.t - t.born, a = age < 0.2 ? age / 0.2 : age > t.dur - 0.3 ? (t.dur - age) / 0.3 : 1, y = G.phase === 'lobby' ? 500 : 1108, h = 84;
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  if (t.kind === 'group') {
    panel(60, y, 960, h, 18, 'rgba(18,24,48,0.94)', '#ffd56b', 3);
    txt(t.title, 540, y + 28, 26, '#ffd56b', 'center', { lw: 5 });
    setFont(22); txt(fitText(t.names.join(', '), 920), 540, y + 62, 22, '#ffffff', 'center', { stroke: false });
  } else {
    const T = TEAM[t.team], gift = t.kind === 'gift', ad = CITY[T.city].ad;
    panel(60, y, 960, h, 18, 'rgba(18,24,48,0.94)', gift ? '#ffb300' : T.renk, gift ? 5 : 4);
    ctx.fillStyle = T.renk; ctx.beginPath(); ctx.arc(112, y + h / 2, 30, 0, TAU); ctx.fill();
    txt(gift ? '🎁' : '🚩', 112, y + h / 2 + 2, 28, '#fff', 'center', { stroke: false });
    txt(gift ? '🎁 HEDİYE GÖNDERDİ · ' + ad : ad.toLocaleUpperCase('tr') + ' ORDUSUNA KATILDI', 160, y + 24, 20, '#ffd56b', 'left', { stroke: false });
    setFont(34); txt(fitText(t.name, 520), 160, y + 58, 34, '#ffffff', 'left', { lw: 5 });
    if (gift) txt('🛡️ ORDU GELDİ! · Teşekkürler 💛', 1000, y + 58, 24, '#ffd23d', 'right', { lw: 4 });
  }
  ctx.restore();
}
function drawBlast() {
  const b = G.blast; if (!b || G.phase === 'results') return;
  const age = G.t - b.born, dur = 2.4, a = age > dur - 0.4 ? (dur - age) / 0.4 : 1, T = TEAM[b.team];
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  const pop = age < 0.3 ? 0.4 + 0.9 * easeOut(age / 0.3) : 1.1 - Math.min(0.1, (age - 0.3) * 0.2);
  ctx.translate(540, 760); ctx.scale(pop, pop);
  txt('🛡️ ORDU GELDİ!', 0, 0, 92, '#ffd23d', 'center', { font: TFONT, lw: 12, sc: 'rgba(70,30,0,0.95)' });
  txt(CITY[T.city].ad + ' · ' + b.name, 0, 72, 40, '#ffffff', 'center', { lw: 7 });
  ctx.restore();
}
function drawResults() {
  if (G.phase !== 'results' || G.winner < 0) return;
  const T = TEAM[G.winner], C = CITY[T.city], a = Math.min(1, G.phaseT / 0.4);
  ctx.fillStyle = 'rgba(8,10,20,' + 0.45 * a + ')'; ctx.fillRect(0, 0, W, H);
  const sc = G.phaseT < 0.5 ? 0.3 + 0.7 * easeOut(G.phaseT / 0.5) : 1;
  ctx.save(); ctx.translate(540, 470); ctx.scale(sc, sc);
  panel(-470, -150, 940, 330, 30, 'rgba(14,18,34,0.92)', T.renk, 6);
  txt('🏆 ' + C.ad.toLocaleUpperCase('tr'), 0, -70, 84, '#ffffff', 'center', { font: TFONT, lw: 12, sc: T.renk });
  txt('KAZANDI!', 0, 20, 70, '#ffd23d', 'center', { font: TFONT, lw: 10 });
  txt('🗺️ ' + regionsOf(G.winner) + ' il · 👥 ' + T.members.size + ' asker · 🏆 ' + (T.wins || 1) + '. zafer', 0, 100, 32, '#ffffff', 'center', { lw: 6 });
  const m = topMembers(G.winner, 3).map(p => p.name);
  if (m.length) { setFont(28); txt(fitText('Komutanlar: ' + m.join(', '), 880), 0, 148, 28, '#ffd56b', 'center', { lw: 5 }); }
  ctx.restore();
  const left = Math.max(0, Math.ceil(CFG.resultsSeconds - G.phaseT));
  txt(NET.embedded ? 'Oyun seçimine ' + left + ' sn' : 'Yeni tur ' + left + ' sn sonra', 540, 1130, 30, '#cfd3f2', 'center', { lw: 5 });
}
function render() { ctx.clearRect(0, 0, W, H); drawScene(); drawHud(); drawLobby(); drawBlast(); drawCard(); drawResults(); }

newRound();
startLoop(update, render);
NET.ready();
MUZIK.start('savas');   // kısık arka plan müziği (telifsiz, anlık üretilir)

/* ---------- deneme paneli (?test=1) ---------- */
if (/[?&]test=1\b/.test(location.search)) (function () {
  const p = document.createElement('div'); p.id = 'testp';
  const names = ['Ayşe', 'Mehmet', 'Zeynep', 'Ali', 'Elif', 'Can', 'Deniz', 'Ece', 'Burak', 'Selin'];
  const cities = ['istanbul', 'ankara', '35', 'antep', 'urfa', 'trabzon', 'van', 'konya', 'diyarbakır', 'bursa', 'adana', 'erzurum'];
  const anyP = () => { const n = pick(names) + ((Math.random() * 90) | 0); return { user: n.toLowerCase(), nickname: n }; };
  const known = () => { const a = Array.from(G.players.values()); return a.length ? (q => ({ user: q.key, nickname: q.raw }))(pick(a)) : anyP(); };
  const btns = [
    ['🏙️ 12 şehirden asker', () => { for (const c of cities) onEvent({ type: 'chat', ...anyP(), text: c }); }],
    ['❤️ 30 beğeni', () => onEvent({ type: 'like', ...known(), count: 30 })],
    ['🎁 Gül', () => onEvent({ type: 'gift', ...known(), giftName: 'Gül', diamonds: 1, count: 1 })],
    ['⏩ Başlat', () => { if (G.phase === 'lobby') G.lobbyEnd = G.t + 0.1; }],
    ['🤖 Kalabalık', () => { if (p.iv) { clearInterval(p.iv); p.iv = null; return; } p.iv = setInterval(() => { const r = Math.random(); onEvent(r < 0.8 ? { type: 'like', ...known(), count: 1 + ((Math.random() * 10) | 0) } : { type: 'chat', ...anyP(), text: pick(cities) }); }, 200); }]
  ];
  for (const [l, f] of btns) { const b = document.createElement('button'); b.textContent = l; b.onclick = f; p.appendChild(b); }
  document.body.appendChild(p);
})();
